services:

  jenkins:
    container_name: jenkins
    build: ./jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data
    # Nexus reserves ~2.7 GB by default, too much next to Jenkins in 4 GB Docker
    environment:
      JAVA_MIN_MEM: 512m
      JAVA_MAX_MEM: 1g
      DIRECT_MAX_MEM: 512m
    restart: unless-stopped

volumes:
  jenkins_home:
  nexus-data:
